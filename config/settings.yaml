# Scalper Bot Configuration — Universal Final 4-Layer WF Optimized Strategy
# Adaptive PMax + Keltner Channel + Graduated DCA [0.5,3,3.75,3.75] + Graduated TP [50,80,85,90]
# $10K -> $1,676,100 | +16,661% | DD 3.0% | WR 92.6% | PF 8.80 | 112,863 trades | 360 gun
# 365/365 gun karli | 53/53 hafta karli | Ort haftalik $28,449 ($10K kasa)
# 4-Layer Walk-Forward: PMax(38fold)->KC(38fold)->DCA(38fold)->TP(38fold) | Konsensus medyan
# Filtreler KAPALI, DynComp KAPALI, PCT Stop KAPALI — saf sinyal kalitesi
# 2026-03-19

exchange:
  name: binance
  futures: true
  base_url: "https://fapi.binance.com"
  ws_url: "wss://fstream.binance.com"

strategy:
  timeframes:
    - label: "3m"
      timeframe: "3m"
      size_multiplier: 1

      # --- ADAPTIVE PMAX (4-Layer WF Konsensus - 38 fold) ---
      pmax:
        source: "hl2"
        adaptive: true
        # Base parameters (sabit)
        atr_period: 10
        atr_multiplier: 3.0
        ma_type: "EMA"
        ma_length: 10
        change_atr: true
        normalize_atr: false
        # Adaptive parameters (38 fold WF konsensus medyan)
        vol_lookback: 260        # Volatilite median penceresi (bar)
        flip_window: 360         # Yon degisim sayma penceresi (bar)
        mult_base: 3.25          # ATR carpan tabani
        mult_scale: 2.0          # Volatiliteye bagli carpan olcekleme
        ma_base: 11              # MA uzunluk tabani
        ma_scale: 4.5            # Trende bagli MA olcekleme
        atr_base: 15             # ATR period tabani
        atr_scale: 2.0           # Flip sayisina bagli ATR olcekleme
        update_interval: 55      # Her 55 barda bir guncelle

      # --- KELTNER CHANNEL (WF Konsensus - CV=0.000 mutlak) ---
      keltner:
        length: 3                # KC EMA periyodu
        multiplier: 0.5          # KC ATR carpani (bant genisligi)
        atr_period: 2            # KC ATR periyodu

      # --- FILTERS (DEVRE DISI - saf sinyal kalitesi) ---
      filters:
        ema_trend:
          enabled: false
          period: 144
        rsi:
          enabled: false
          period: 28
          overbought: 65
          oversold: 35
        atr_volatility:
          enabled: false
          atr_period: 50
          min_atr_percentile: 20

  # --- DYNAMIC COMPOUNDING (1/40 kasa/margin orani) ---
  dynamic_comp:
    enabled: true
    tiers:
      - max_balance: 999999999
        comp_pct: 2.5              # kasa * 2.5% = kasa/40 margin

trading:
  initial_balance: 1000.0
  leverage: 25                    # 25x leverage
  symbols:
    - "ALL"                          # Tum USDT-M Futures pairleri icin gecerli
  margin_per_trade: 25.0          # Base margin ($1000/40 = $25, DynComp override eder)
  max_pairs: 50
  trade_type: "BOTH"
  maker_fee: 0.0002
  taker_fee: 0.0005
  hedge_mode: false

  # --- GRADUATED DCA (WF Konsensus) ---
  # Kucuk giris (0.5x), agresif toparlanma (3-3.75x)
  dca_step_multipliers: [0.50, 3.00, 3.75, 3.75]

  # --- GRADUATED TP (WF Konsensus - tp4 CV=0.000 mutlak) ---
  # Hafif DCA %50 kapat, derin DCA %90 kapat
  tp_step_pcts: [0.50, 0.80, 0.85, 0.90]

  # --- COOLDOWNS (opsiyonel, 0 = devre disi) ---
  min_ms_between_dca: 0           # DCA hiz siniri (ms, 0=yok)
  min_ms_before_reversal: 0       # Reversal cooldown (ms, 0=yok)

  # --- RISK ---
  hard_stop:
    enabled: false                # ATR-based hard stop devre disi
    atr_multiplier: 5.0
    atr_period: 11
  dynamic_sl:
    enabled: false                # DYN_SL devre disi — PCT hard stop kullaniliyor
    atr_multiplier: 2.5
    atr_period: 12
    tighten_on_dca_full: 0.95
  pct_hard_stop:
    enabled: false                # PCT Stop DEVRE DISI
    loss_pct: 2.0
  max_dca_steps: 4                # Maksimum 4 DCA adimi
  tp_close_pct: 0.50              # Default TP (graduated TP override eder)

protection:
  max_drawdown_pct: 25.0          # Max DD %25 siniri
  max_total_margin_pct: 70.0
  max_open_positions: 50
