# Scalper Bot Configuration — ETHUSDT E-Scenario Strategy
# Adaptive PMax + Keltner Channel + Graduated DCA [1,1.5,2,2.5] + Graduated TP [50,60,70,80]
# $10K -> $1,335,820 | +13,258.2% | DD 30.4% | WR 84.4% | PF 1.70 | 5,751 trades | 118 gun
# Haftalik (53 hafta, $10K sabit): %90.6 karli | Ort +37.8%/hafta | Max DD 30.4%
# Rust Engine 178x | 2026-03-17

exchange:
  name: binance
  futures: true
  base_url: "https://fapi.binance.com"
  ws_url: "wss://fstream.binance.com"

strategy:
  timeframes:
    - label: "3m"
      timeframe: "3m"
      size_multiplier: 1

      # --- ADAPTIVE PMAX (Unified WF) ---
      pmax:
        source: "hl2"
        adaptive: true
        # Base parameters (sabit, adaptive guncelleme icin temel)
        atr_period: 10
        atr_multiplier: 3.0
        ma_type: "EMA"
        ma_length: 10
        change_atr: true
        normalize_atr: false
        # Adaptive parameters (1000 trial x 25 hafta optimize)
        vol_lookback: 580        # Volatilite median penceresi (bar)
        flip_window: 440         # Yon degisim sayma penceresi (bar)
        mult_base: 4.0           # ATR carpan tabani
        mult_scale: 1.25         # Volatiliteye bagli carpan olcekleme
        ma_base: 3               # MA uzunluk tabani
        ma_scale: 5.5            # Trende bagli MA olcekleme
        atr_base: 19             # ATR period tabani
        atr_scale: 1.5           # Flip sayisina bagli ATR olcekleme
        update_interval: 29      # Her 29 barda bir guncelle

      # --- KELTNER CHANNEL (Unified WF) ---
      keltner:
        length: 5                # KC EMA periyodu
        multiplier: 0.8          # KC ATR carpani (bant genisligi)
        atr_period: 3            # KC ATR periyodu

      # --- FILTERS ---
      filters:
        ema_trend:
          enabled: true
          period: 144             # EMA(144) trend filtresi
        rsi:
          enabled: true
          period: 28              # RSI(28)
          overbought: 65          # LONG: RSI < 65
          oversold: 35            # SHORT: RSI > 35
        atr_volatility:
          enabled: true
          atr_period: 50          # ATR(50) volatilite filtresi
          min_atr_percentile: 20  # %20 percentile altinda islem yapma

  # --- KELLY DYNAMIC COMPOUNDING ---
  dynamic_comp:
    enabled: true
    tiers:
      - max_balance: 30000
        comp_pct: 3.0             # < $30K: %3 margin
      - max_balance: 150000
        comp_pct: 5.0             # $30K-$150K: %5 margin (buyume)
      - max_balance: 999999999
        comp_pct: 2.25            # > $150K: %2.25 margin (muhafazakar)

trading:
  initial_balance: 10000.0
  leverage: 25                    # 25x leverage
  symbols:
    - "ETHUSDT"
  margin_per_trade: 300.0         # Base margin (dynamic comp overrides)
  max_pairs: 1
  trade_type: "BOTH"
  maker_fee: 0.0002
  taker_fee: 0.0005
  hedge_mode: false

  # --- GRADUATED DCA (E-Scenario) ---
  # Her DCA adiminda artan margin carpani
  # Derin DCA = daha agresif entry duzeltme
  dca_step_multipliers: [1.0, 1.5, 2.0, 2.5]

  # --- GRADUATED TP (E-Scenario) ---
  # DCA derinligine gore TP kapatma orani artar
  # Buyuk pozisyon = agresif kar alma = DD kontrolu
  tp_step_pcts: [0.50, 0.60, 0.70, 0.80]

  # --- COOLDOWNS (opsiyonel, 0 = devre disi) ---
  min_ms_between_dca: 0           # DCA hiz siniri (ms, 0=yok)
  min_ms_before_reversal: 0       # Reversal cooldown (ms, 0=yok)

  # --- RISK ---
  hard_stop:
    enabled: false                # ATR-based hard stop devre disi
    atr_multiplier: 5.0
    atr_period: 11
  dynamic_sl:
    enabled: false                # DYN_SL devre disi — PCT hard stop kullaniliyor
    atr_multiplier: 2.5
    atr_period: 12
    tighten_on_dca_full: 0.95
  pct_hard_stop:
    enabled: true                 # Yuzde bazli hard stop AKTIF
    loss_pct: 2.0                 # DCA full sonrasi %2.0 kayip = pozisyon kapat
  max_dca_steps: 4                # Maksimum 4 DCA adimi
  tp_close_pct: 0.50              # Default TP (graduated TP override eder)

protection:
  max_drawdown_pct: 25.0          # Max DD %25 siniri
  max_total_margin_pct: 70.0
  max_open_positions: 1
