<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <!-- S gradient: deep blue metallic -->
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="30%" stop-color="#1a4a8a"/>
      <stop offset="60%" stop-color="#2a6ab8"/>
      <stop offset="100%" stop-color="#0d2d5a"/>
    </linearGradient>
    <!-- K gradient: silver metallic -->
    <linearGradient id="kGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="30%" stop-color="#a0a0a0"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="70%" stop-color="#888"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="50%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#bbb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" result="blur"/>
      <feFlood flood-color="#4A90D9" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.6"/>
  <!-- S -->
  <text x="1.5" y="23" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="18" fill="url(#sGrad)" filter="url(#glow)">S</text>
  <!-- K -->
  <text x="13" y="23" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="16" fill="url(#kGrad)">K</text>
  <!-- Arrow -->
  <line x1="21" y1="15" x2="27" y2="6" stroke="url(#arrowG)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="26,3 30,7 25.5,8" fill="url(#arrowG)"/>
</svg>
